<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAWfit Gym - Management System</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .container{max-width:480px;width:100%;text-align:center}
  .logo{font-size:48px;font-weight:800;letter-spacing:2px;margin-bottom:8px;background:linear-gradient(135deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .tagline{color:#9ca3af;font-size:14px;margin-bottom:48px}
  .cards{display:flex;flex-direction:column;gap:16px}
  .card{display:block;text-decoration:none;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:32px 24px;transition:all .2s}
  .card:hover{border-color:#f97316;transform:translateY(-2px);box-shadow:0 8px 24px rgba(249,115,22,.15)}
  .card-icon{font-size:36px;margin-bottom:12px}
  .card-title{font-size:20px;font-weight:700;margin-bottom:6px}
  .card-desc{font-size:13px;color:#9ca3af}
  .footer{margin-top:48px;color:#4b5563;font-size:12px}
  .footer a{color:#f97316;text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <div class="logo">RAWfit</div>
  <div class="tagline">Gym Management System &middot; Dighapara, West Bengal</div>
  <div class="cards">
    <a href="/admin.html" class="card">
      <div class="card-icon">&#9881;&#65039;</div>
      <div class="card-title">Admin Panel</div>
      <div class="card-desc">Manage members, attendance, exercises, diet plans & charts</div>
    </a>
    <a href="/member/" class="card">
      <div class="card-icon">&#127947;&#65039;</div>
      <div class="card-title">Member Portal</div>
      <div class="card-desc">Check in/out, view exercises, diet & workout plans</div>
    </a>
  </div>
  <div class="footer">GPS Location: 22.944691, 88.5377882 (100m radius)</div>
</div>
</body>
</html>
