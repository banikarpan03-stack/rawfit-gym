# Static workflow: every `run:` step below is a literal command. The only expression
# used is ${{ matrix.node-version }}, which comes from the fixed matrix above and never
# from issue titles, PR bodies, commit messages or other attacker-controllable input —
# so there is no command-injection surface here.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 exercises the better-sqlite3 fallback path; 22 has the built-in
        # node:sqlite driver that production prefers.
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Syntax-check the frontends' inline JS
        run: node scripts/check-frontend-js.js